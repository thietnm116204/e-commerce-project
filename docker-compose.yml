version: '3.8'

services:
  # Database PostgreSQL
  postgres:
    image: postgres:15-alpine
    container_name: ecommerce_db
    environment:
      POSTGRES_DB: ecommerce
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5434:5432" 
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ecommerce"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Back-end Spring Boot
  backend:
    build:
      context: ./back-end/e-commerce
      dockerfile: Dockerfile
    container_name: ecommerce_backend
    env_file:
      - .env
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/ecommerce
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATA_REDIS_HOST=redis
      - SPRING_DATA_REDIS_PORT=6379
      # Ghi đè cấu hình để chạy trong Docker mạng ảo nếu cần
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: ecommerce_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Front-end React Vite
  frontend:
    build:
      context: ./font-end/e-commerce
      dockerfile: Dockerfile
    container_name: ecommerce_frontend
    ports:
      - "5173:80"  # Map port 80 trong container ra 5173 ngoài máy thật để khớp với VNPAY config hiện tại
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
