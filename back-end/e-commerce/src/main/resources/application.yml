spring:
  application:
    name: e-commerce
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}
  datasource:
    url: jdbc:postgresql://localhost:5432/ecommerce
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${DB_PASSWORD:1234}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

app:
  auth:
    cookie:
      secure: false
  jwt:
    secret: ${JWT_SECRET:default-jwt-secret-key-at-least-32-chars-long}
    expiration-seconds: 3600
    refresh-expiration-seconds: 604800
  vnpay:
    tmn-code: ${VNPAY_TMN_CODE:dummy}
    hash-secret: ${VNPAY_HASH_SECRET:dummy-hash-secret-value-for-local-dev}
    pay-url: https://sandbox.vnpayment.vn/paymentv2/vpcpay.html
    return-url: http://localhost:8080/api/v1/payments/vnpay/return
    frontend-return-url: http://localhost:5173/payment/vnpay-return
    ipn-url: http://localhost:8080/api/v1/payments/vnpay/ipn
    version: 2.1.0
    command: pay
    curr-code: VND
    locale: vn
    order-type: other
    expire-minutes: 15

supabase:
  url: ${SUPABASE_URL:https://dummy.supabase.co}
  api-key: ${SUPABASE_API_KEY:dummy}
  bucket: images
